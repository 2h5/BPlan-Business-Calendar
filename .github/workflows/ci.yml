name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Web build
        run: pnpm --filter @cal/web build

  backend-functions:
    name: Backend functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Typecheck Edge Functions
        working-directory: supabase/functions
        run: deno task check

      - name: Test Edge Functions
        working-directory: supabase/functions
        run: deno task test

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Applies every migration from scratch, which also proves they are
      # replayable in order on an empty database.
      - name: Start Supabase
        run: supabase start

      # RLS mistakes are silent in the app, so they are gated here.
      - name: Database tests
        run: supabase test db

      # pgTAP runs in one session and cannot interleave transactions. The race
      # harness drives real concurrent sessions against the local stack only.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: RevenueCat billing race tests
        run: pnpm billing:test:race:local

      - name: Check generated types are current
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts packages/types/src/database.types.ts > /dev/null; then
            echo "::error::Database types are stale. Run 'pnpm db:types' and commit the result."
            diff /tmp/database.types.ts packages/types/src/database.types.ts || true
            exit 1
          fi
